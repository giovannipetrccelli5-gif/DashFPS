name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle --no-daemon build

      - name: Show built files
        run: ls -lah build/libs

      - name: Publish JAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/libs/fpsplus-1.0.0.jar --clobber
          else
            gh release create v1.0.0 build/libs/fpsplus-1.0.0.jar \
              --title "FPS Plus 1.0.0" \
              --notes "Minecraft 26.3 Fabric client mod build."
          fi
