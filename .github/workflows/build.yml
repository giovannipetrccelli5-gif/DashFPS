name: Build DashFPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload JAR artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DashFPS-3.0.0
          path: build/libs/DashFPS-3.0.0.jar
          if-no-files-found: error

      - name: Publish GitHub Release JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.0 >/dev/null 2>&1; then
            gh release upload v3.0.0 build/libs/DashFPS-3.0.0.jar --clobber
          else
            gh release create v3.0.0 build/libs/DashFPS-3.0.0.jar \
              --title "DashFPS 3.0.0" \
              --notes "Minecraft 26.3 / Fabric orchestrator build. Requires Java 25."
          fi
